<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoBlank</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<div id="hurt"></div>
<div id="smokeFx"></div>
<div id="flashFx"></div>
<div id="scope" class="hidden"><div class="scope-ring"></div><i class="scope-h"></i><i class="scope-v"></i></div>
<div id="fps" class="hidden"></div>
<div id="hud" class="hidden">
  <div class="crosshair" id="crosshair">
    <i class="ch-t"></i><i class="ch-b"></i><i class="ch-l"></i><i class="ch-r"></i><b class="ch-dot"></b>
  </div>
  <div class="hitmarker" id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div class="damage-ring" id="damageRing"></div>
  <div class="tag" id="tag"><span id="tagName"></span><div class="tag-hp"><div id="tagHp"></div></div></div>

  <div class="top">
    <div class="side">
      <div class="score-chip you" id="chipA"><span class="label" id="labelA" data-i18n="you">YOU</span><span id="scoreA">0</span></div>
      <div class="pips" id="pipsA"></div>
    </div>
    <div class="clock" id="clock">
      <div id="timer">5:00</div>
      <svg class="bomb-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2"/><rect x="7" y="10" width="6" height="3" fill="#000" opacity=".45"/><path d="M15 4c2 0 3 1 3 3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <div class="limit" id="limitLine"></div>
    </div>
    <div class="side">
      <div class="score-chip lead" id="chipB"><span class="label" id="labelB" data-i18n="leader">LEADER</span><span id="scoreB">0</span></div>
      <div class="pips" id="pipsB"></div>
    </div>
  </div>

  <div class="killfeed" id="killfeed"></div>
  <canvas class="radar" id="radar"></canvas>

  <div class="vitals">
    <div class="stat hp"><svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg><span id="hpNum">100</span></div>
  </div>

  <div class="weapon">
    <div class="slots" id="slots"></div>
    <div class="ammo" id="ammo"><span id="mag">30</span><span class="reserve">/ <span id="reserve">90</span></span></div>
  </div>

  <div class="progress" id="progress"><div class="progress-label" id="progressLabel"></div><div class="progress-track"><div id="progressFill"></div></div></div>
  <div class="hint" id="hint"></div>
  <div class="resume" id="resumeHint" data-i18n="clickResume">CLICK TO CONTINUE</div>
  <div class="spec" id="spec"><span data-i18n="watching">SPECTATING</span> <b id="specName"></b><small data-i18n="specNext">LMB — next player</small></div>

  <div class="medal" id="medal"></div>
  <div class="notice" id="notice"></div>
  <div class="toast" id="toast"></div>
  <div class="banner" id="banner"></div>
  <div class="death" id="death">
    <div class="death-title" data-i18n="eliminated">ELIMINATED</div>
    <div class="death-by"><span data-i18n="by">by</span> <b id="killerName"></b></div>
    <div class="death-timer" id="deathTimer"></div>
  </div>

  <div class="board hidden" id="board"></div>
</div>

<div id="screens">
  <section class="screen" id="loading">
    <div class="brand">NOBLANK</div>
    <div class="load-track"><div class="load-fill" id="loadFill"></div></div>
    <div class="load-text" id="loadText" data-i18n="loading">loading assets</div>
  </section>

  <section class="screen hidden" id="menu">
    <div class="lobby-bg" id="lobbyBg"></div>
    <div class="lobby">
      <header class="lobby-head">
        <div class="brand small">NOBLANK</div>
        <nav class="lobby-nav">
          <button class="nav-btn on" data-i18n="play">PLAY</button>
          <button class="nav-btn" id="settingsBtn" data-i18n="settings">Settings</button>
        </nav>
        <div class="profile"><label data-i18n="callsign">Callsign</label><input id="nameInput" maxlength="14" spellcheck="false"></div>
      </header>

      <div class="lobby-body">
        <div class="lobby-main">
          <div class="section-title" data-i18n="mode">Mode</div>
          <div class="cards modes" id="modeCards"></div>
          <div class="section-title" data-i18n="map">Map</div>
          <div class="cards maps" id="mapCards"></div>
        </div>
        <aside class="lobby-side">
          <div class="mode-info" id="modeInfo"></div>
          <div class="field">
            <label data-i18n="difficulty">Bot difficulty</label>
            <div class="seg" data-key="difficulty">
              <button data-v="easy" data-i18n="easy">Easy</button><button data-v="normal" data-i18n="normal">Normal</button><button data-v="hard" data-i18n="hard">Hard</button>
            </div>
          </div>
          <div class="field">
            <label><span data-i18n="bots">Bots</span> <span class="val" id="botsVal">7</span></label>
            <input type="range" id="botsInput" min="1" max="11" step="1">
          </div>
          <div class="field">
            <label id="limitLabel" data-i18n="limit">Score limit</label>
            <div class="seg" data-key="limit" id="limitSeg"><button data-v="0">10</button><button data-v="1">20</button><button data-v="2">30</button></div>
          </div>
          <div class="field" id="timeField">
            <label data-i18n="time">Time (min)</label>
            <div class="seg" data-key="minutes"><button data-v="3">3</button><button data-v="5">5</button><button data-v="10">10</button></div>
          </div>
          <button class="primary play" id="playBtn" data-i18n="play">PLAY</button>
        </aside>
      </div>
      <footer class="controls" id="controlsLine"></footer>
    </div>
  </section>

  <section class="screen hidden" id="sideScreen">
    <div class="pick">
      <div class="steps"><b class="on">1</b><i></i><b>2</b><i></i><b>3</b></div>
      <div class="title" data-i18n="chooseSide">Choose your side</div>
      <div class="sides-row">
        <button class="side-card a" data-side="A"><img id="sideArtA" alt=""><div><b data-i18n="team_A">SPECIAL FORCES</b><small data-i18n="sideA_d">Defend the sites, stop the bomb.</small></div></button>
        <button class="side-card b" data-side="B"><img id="sideArtB" alt=""><div><b data-i18n="team_B">TERRORISTS</b><small data-i18n="sideB_d">Plant the C4 and hold the site.</small></div></button>
      </div>
      <div class="row-buttons"><button class="ghost" id="sideBack" data-i18n="back">Back</button></div>
    </div>
  </section>

  <section class="screen hidden" id="charScreen">
    <div class="pick">
      <div class="steps"><b class="done">1</b><i class="on"></i><b class="on">2</b><i></i><b>3</b></div>
      <div class="title" data-i18n="chooseChar">Choose your character</div>
      <div class="cards chars" id="charCards"></div>
      <div class="row-buttons">
        <button class="ghost" id="charBack" data-i18n="back">Back</button>
        <button class="primary" id="charNext" data-i18n="next">Next</button>
      </div>
    </div>
  </section>

  <section class="screen hidden" id="loadoutScreen">
    <div class="menu-card loadout-card">
      <div class="steps" id="loadoutSteps"><b class="done">1</b><i class="on"></i><b class="done">2</b><i class="on"></i><b class="on">3</b></div>
      <div class="title" data-i18n="chooseLoadout">Choose your loadout</div>
      <div class="loadout-grid">
        <div class="lo-col">
          <div class="section-title" data-i18n="primary">Primary</div>
          <div class="cards guns primary" id="primaryCards"></div>
        </div>
        <div class="lo-col">
          <div class="section-title" data-i18n="secondary">Secondary</div>
          <div class="cards guns two" id="secondaryCards"></div>
          <div class="section-title" data-i18n="grenadesLabel">Grenade</div>
          <div class="cards guns two" id="grenadeCards"></div>
          <div class="section-title" data-i18n="melee">Melee</div>
          <div class="cards guns three" id="fixedCards"></div>
        </div>
      </div>
      <div class="hint-line" id="loadoutHintLine" data-i18n="loadoutHint">Applies on next spawn</div>
      <div class="row-buttons">
        <button class="ghost hidden" id="loadoutCancel" data-i18n="back">Back</button>
        <button class="primary" id="loadoutBack" data-i18n="done">Done</button>
      </div>
    </div>
  </section>

  <section class="screen hidden" id="settings">
    <div class="menu-card settings-card">
      <div class="title" data-i18n="settings">Settings</div>
      <div class="settings-grid">
        <div class="field">
          <label data-i18n="language">Language</label>
          <div class="seg" data-key="lang"><button data-v="en">English</button><button data-v="ru">Русский</button></div>
        </div>
        <div class="field">
          <label data-i18n="graphics">Graphics</label>
          <div class="seg" data-key="quality"><button data-v="low" data-i18n="low">Low</button><button data-v="medium" data-i18n="medium">Medium</button><button data-v="high" data-i18n="high">High</button></div>
        </div>
        <div class="field">
          <label><span data-i18n="sensitivity">Sensitivity</span> <span class="val" id="sensVal">1.0</span></label>
          <input type="range" id="sensInput" min="0.2" max="3" step="0.05">
        </div>
        <div class="field">
          <label><span data-i18n="fov">Field of view</span> <span class="val" id="fovVal">78</span></label>
          <input type="range" id="fovInput" min="65" max="100" step="1">
        </div>
        <div class="field">
          <label><span data-i18n="volume">Volume</span> <span class="val" id="volVal">80</span></label>
          <input type="range" id="volInput" min="0" max="100" step="1">
        </div>
        <div class="field">
          <label data-i18n="crosshair">Crosshair</label>
          <div class="seg swatches" data-key="crosshair"><button data-v="green"><i style="background:#4dff6a"></i></button><button data-v="cyan"><i style="background:#5ef2ff"></i></button><button data-v="yellow"><i style="background:#ffe14d"></i></button><button data-v="white"><i style="background:#fff"></i></button><button data-v="pink"><i style="background:#ff5ccd"></i></button></div>
        </div>
        <div class="field">
          <label data-i18n="crossStyle">Crosshair style</label>
          <div class="seg" data-key="crossStyle"><button data-v="static" data-i18n="static">Static</button><button data-v="dynamic" data-i18n="dynamic">Dynamic</button></div>
        </div>
        <div class="field">
          <label data-i18n="fullscreen">Fullscreen</label>
          <div class="seg" data-key="fullscreen"><button data-v="off" data-i18n="off">Off</button><button data-v="on" data-i18n="on">On</button></div>
        </div>
        <div class="field">
          <label data-i18n="fpsCounter">FPS counter</label>
          <div class="seg" data-key="showFps"><button data-v="off" data-i18n="hide">Hide</button><button data-v="on" data-i18n="show">Show</button></div>
        </div>
      </div>
      <button class="primary" id="settingsBack" data-i18n="done">Done</button>
    </div>
  </section>

  <section class="screen hidden" id="pause">
    <div class="menu-card narrow">
      <div class="title" data-i18n="paused">Paused</div>
      <button class="primary" id="resumeBtn" data-i18n="resume">Resume</button>
      <button class="ghost" id="pauseLoadoutBtn" data-i18n="loadout">Loadout</button>
      <button class="ghost" id="pauseSettingsBtn" data-i18n="settings">Settings</button>
      <button class="ghost" id="quitBtn" data-i18n="quit">Quit to menu</button>
    </div>
  </section>

  <section class="screen hidden" id="results">
    <div class="menu-card wide">
      <div class="title big" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="board static" id="resultBoard"></div>
      <button class="primary" id="againBtn" data-i18n="again">Play again</button>
      <button class="ghost" id="menuBtn" data-i18n="menu">Main menu</button>
    </div>
  </section>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
